name: Publish Companion release

on:
  push:
    branches: [main]
    paths:
      - 'dist/0.17.14/**'
      - 'docs/release-notes/v0.17.14.md'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-companion-v0.17.14
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '0.17.14'
    steps:
      - name: Retrieve the published commit
        shell: bash
        run: |
          set -euo pipefail
          git init repository
          cd repository
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Assemble the release archive
        shell: bash
        working-directory: repository/dist/0.17.14
        run: cat Majestic-Companion-0.17.14.zip.part* > Majestic-Companion-0.17.14.zip
      - name: Verify the archive checksum
        shell: bash
        working-directory: repository/dist/0.17.14
        run: sha256sum --check Majestic-Companion-0.17.14.zip.sha256
      - name: Publish the stable release
        shell: bash
        working-directory: repository
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; existing files will not be overwritten.'
            exit 0
          fi
          gh release create "v${VERSION}" \
            "dist/${VERSION}/Majestic-Companion-${VERSION}.zip" \
            "dist/${VERSION}/Majestic-Companion-${VERSION}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${VERSION}" \
            --notes-file "docs/release-notes/v${VERSION}.md" \
            --latest
      - name: Refresh release descriptions
        shell: bash
        working-directory: repository
        run: |
          set -euo pipefail
          for notes in docs/release-notes/v*.md; do
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          done
